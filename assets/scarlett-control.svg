<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="chassis" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cc181e"/>
      <stop offset="30%" stop-color="#e61c24"/>
      <stop offset="70%" stop-color="#c41218"/>
      <stop offset="100%" stop-color="#800b0f"/>
    </linearGradient>
    <linearGradient id="faceplate" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="knob" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="50%" stop-color="#222"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="silverRing" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#888888"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Scarlett Outer Body -->
  <rect x="18" y="58" width="220" height="140" rx="16" fill="url(#chassis)" filter="url(#shadow)"/>
  <rect x="22" y="62" width="212" height="132" rx="12" fill="none" stroke="#ff4d4d" stroke-width="1.5" opacity="0.6"/>

  <!-- Front Faceplate (Black insert) -->
  <rect x="28" y="74" width="200" height="108" rx="8" fill="url(#faceplate)" stroke="#111" stroke-width="2"/>

  <!-- XLR / Jack Combo Input 1 -->
  <circle cx="56" cy="120" r="18" fill="#151515" stroke="#444" stroke-width="2"/>
  <circle cx="56" cy="120" r="14" fill="#050505"/>
  <circle cx="56" cy="120" r="5" fill="#222" stroke="#555" stroke-width="1"/>
  <!-- Pins -->
  <circle cx="52" cy="115" r="2" fill="#ffd700"/>
  <circle cx="60" cy="115" r="2" fill="#ffd700"/>
  <circle cx="56" cy="125" r="2" fill="#ffd700"/>
  <text x="56" y="148" font-family="sans-serif" font-size="7" font-weight="bold" fill="#888" text-anchor="middle">IN 1</text>

  <!-- Input 1 Gain Knob + Halo Ring -->
  <circle cx="94" cy="120" r="14" fill="none" stroke="#00e676" stroke-width="2.5" opacity="0.85"/>
  <circle cx="94" cy="120" r="11" fill="url(#knob)" stroke="#333" stroke-width="1"/>
  <circle cx="94" cy="120" r="4" fill="#111"/>
  <line x1="94" y1="120" x2="102" y2="114" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- XLR / Jack Combo Input 2 -->
  <circle cx="132" cy="120" r="18" fill="#151515" stroke="#444" stroke-width="2"/>
  <circle cx="132" cy="120" r="14" fill="#050505"/>
  <circle cx="132" cy="120" r="5" fill="#222" stroke="#555" stroke-width="1"/>
  <!-- Pins -->
  <circle cx="128" cy="115" r="2" fill="#ffd700"/>
  <circle cx="136" cy="115" r="2" fill="#ffd700"/>
  <circle cx="132" cy="125" r="2" fill="#ffd700"/>
  <text x="132" y="148" font-family="sans-serif" font-size="7" font-weight="bold" fill="#888" text-anchor="middle">IN 2</text>

  <!-- Input 2 Gain Knob + Halo Ring -->
  <circle cx="170" cy="120" r="14" fill="none" stroke="#00e676" stroke-width="2.5" opacity="0.85"/>
  <circle cx="170" cy="120" r="11" fill="url(#knob)" stroke="#333" stroke-width="1"/>
  <circle cx="170" cy="120" r="4" fill="#111"/>
  <line x1="170" y1="120" x2="178" y2="114" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Big Monitor Volume Knob -->
  <circle cx="206" cy="116" r="16" fill="url(#silverRing)"/>
  <circle cx="206" cy="116" r="14" fill="url(#knob)"/>
  <line x1="206" y1="116" x2="206" y2="104" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
  <text x="206" y="142" font-family="sans-serif" font-size="7" font-weight="bold" fill="#888" text-anchor="middle">MONITOR</text>

  <!-- 48V / AIR LEDs -->
  <circle cx="80" cy="94" r="3" fill="#ff1744"/>
  <text x="80" y="87" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ff5252" text-anchor="middle">48V</text>

  <circle cx="108" cy="94" r="3" fill="#ffea00"/>
  <text x="108" y="87" font-family="sans-serif" font-size="6" font-weight="bold" fill="#ffea00" text-anchor="middle">AIR</text>

  <circle cx="156" cy="94" r="3" fill="#00e5ff"/>
  <text x="156" y="87" font-family="sans-serif" font-size="6" font-weight="bold" fill="#00e5ff" text-anchor="middle">DIRECT</text>

  <!-- Brand label bottom left -->
  <text x="36" y="170" font-family="sans-serif" font-size="8" font-weight="900" fill="#bbb" letter-spacing="1">Focusrite</text>
  <text x="96" y="170" font-family="sans-serif" font-size="7" fill="#666">Scarlett 2i2</text>
</svg>

